<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dakang Wang</title>

  <style>

    @font-face{
      font-family: "MenuFont";
      src: url("Font/Zodiak_Complete/Fonts/OTF/Zodiak-Regular.otf") format("opentype");
    }
    @font-face{
      font-family: "TitleFont";
      src: url("Font/Zodiak_Complete/Fonts/OTF/Zodiak-BoldItalic.otf") format("opentype");
    }

    :root{
      --font-body: "MenuFont", sans-serif;
      --font-nav: "MenuFont", sans-serif;
      --font-title: "TitleFont", sans-serif;

      /* 菜单展开内容：副标题/时间（可单独改） */
      --font-menu-subtitle: "TitleFont", sans-serif;
      --menu-subtitle-size: 20px;
      --menu-subtitle-weight: 700;

      /* Exhibitions：年份/日期（可单独改） */
      --font-ex-date: "TitleFont", sans-serif;
      --ex-date-size: 22px;
      --ex-date-weight: 700;

      --bg: #ffffff;
      --text: #111111;
      --red: #ff0000;

      --nav-size: 30px;
      --work-size: 70px;

      --nav-pad-x: 28px;
      --nav-pad-y: 18px;

      --list-pad-x: 28px;
      --list-pad-top: 26px;

      --fade-ms: 420ms;

      --panel-gap: 40px;
      --img-gap: 18px;

      --detail-body-size: 15px;

      --header-offset: 92px;
      --menu-title-size: 50px;

      --works-nudge-up: 18px;
    }

    *{ box-sizing: border-box; }
    html, body { height: 100%; }

    body{
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      overflow: hidden;
    }

    /* ===== hover background images ===== */
    .bg{
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: var(--bg);
      transition: opacity 220ms ease;
    }
    .bg.is-hidden{ opacity: 0; }

    .bg__layer{
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity var(--fade-ms) ease;
      will-change: opacity;
    }
    .bg__layer.is-visible{ opacity: 1; }

    /* ===== fixed header ===== */
    header{
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      padding: var(--nav-pad-y) var(--nav-pad-x);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: transparent;
    }
    .brand a,
    .nav a{
      font-size: var(--nav-size);
      font-family: var(--font-nav);
      line-height: 1;
      text-decoration: none;
      color: var(--text);
      transition: color 180ms ease;
      cursor: pointer;
    }
    .nav{
      display: flex;
      gap: 26px;
      align-items: center;
    }
    .nav a:hover{ color: var(--red); }

    /* ===== main scroll ===== */
    main{
      position: relative;
      z-index: 2;
      height: 100%;
      overflow: auto;
      padding:
        calc(var(--header-offset) + var(--list-pad-top))
        var(--list-pad-x)
        48px
        var(--list-pad-x);
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    main::-webkit-scrollbar{ width:0; height:0; }

    /* Works 点击后：作品列表整体向上滑动一点（有动画） */
    #worksList{
      transition: transform 320ms ease;
      will-change: transform;
    }
    body.works-tight #worksList{
      transform: translateY(calc(-1 * var(--works-nudge-up)));
    }

    /* ===== menu panels ===== */
    .menu-panel{
      width: 100%;
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transform: translateY(-6px);
      transition: max-height 520ms ease, opacity 260ms ease, transform 260ms ease;
      will-change: max-height, opacity, transform;
      margin: 0 0 20px 0;
    }
    .menu-panel.is-open{
      opacity: 1;
      transform: translateY(0);
    }

    .menu-panel-inner{
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: var(--panel-gap);
      padding: 18px 0 6px 0;
      align-items: start;
    }

    .menu-title{
      font-family: var(--font-title);
      font-size: var(--menu-title-size);
      font-weight: 700;
      line-height: 1.05;
      margin: 0 0 14px 0;
    }

    .menu-text{
      font-family: var(--font-body);
      font-size: var(--detail-body-size);
      line-height: 1.85;
      margin: 0 0 18px 0;
      max-width: 52ch;
      white-space: pre-wrap;
    }

    /* 副标题（Education / Artist Statement / Contact） */
    .menu-subtitle{
      font-family: var(--font-menu-subtitle);
      font-size: var(--menu-subtitle-size);
      font-weight: var(--menu-subtitle-weight);
      line-height: 1.25;
      margin: 70px 0 8px 0;
    }
    .menu-subtitle--first{ margin-top: 0; }

    /* 时间区间（Education 每条的时间） */
    .menu-time{
      font-family: var(--font-menu-subtitle);
      font-size: var(--menu-subtitle-size);
      font-weight: var(--menu-subtitle-weight);
      line-height: 1.25;
      margin: 10px 0 6px 0;
      opacity: .95;
    }

    .menu-block{
      margin-bottom: 14px;
      max-width: 52ch;
    }
    .menu-block p{
      margin: 0;
      font-family: var(--font-body);
      font-size: var(--detail-body-size);
      line-height: 1.85;
    }

    .menu-links{
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }
    .menu-links a{
      font-family: var(--font-body);
      font-size: var(--detail-body-size);
      text-decoration: none;
      color: var(--text);
      width: fit-content;
      opacity: .9;
      transition: color 180ms ease, opacity 180ms ease;
    }
    .menu-links a:hover{ color: var(--red); opacity: 1; }

    /* 只给 ins 和 email 下划线 */
    .menu-links a.is-underlined{
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* Info 最后一行版权 */
    .rights{
      margin-top: 22px;
      font-family: var(--font-body);
      font-size: var(--detail-body-size);
      line-height: 1.6;
      opacity: .85;
    }

    .menu-panel-inner.one-col{ grid-template-columns: 1fr; }

    /* ====== ✅ 图片区：支持自由两张并列（不裁切） ====== */
    .gallery{
      display: flex;
      flex-direction: column;
      gap: var(--img-gap);
      padding-bottom: var(--img-gap);
    }
    .gallery-row{
      display: grid;
      gap: var(--img-gap);
      align-items: start;
    }
    .gallery-row.one{ grid-template-columns: 1fr; }
    .gallery-row.two{ grid-template-columns: 1fr 1fr; }

    .gallery-row img{
      width: 100%;
      max-width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
    }


    /* ====== ✅ Works: 双列独立滚动（右侧图片区） ====== */
    .gallery-split{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--img-gap);
      align-items: start;
    
      min-width: 0;
    }
    .gallery-col{
      display: flex;
      flex-direction: column;
      gap: var(--img-gap);
      overflow: visible;          /* ✅ 不做内部裁切/滚动 */
      max-height: none;           /* ✅ 让面板高度跟随图片完整展开 */
      padding-right: 0;
    
      min-width: 0;
    }
    .gallery-col::-webkit-scrollbar{ width:0; height:0; }

    .zoomable{
      cursor: zoom-in;
    }

    /* ====== ✅ Lightbox (点击放大) ====== */
    .lightbox{
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 34px;
      background: rgba(255,255,255,.35);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .lightbox.is-open{ display: flex; }

    .lightbox__img{
      max-width: 92vw;
      max-height: 90vh;
      width: auto;
      height: auto;
      object-fit: contain;
      box-shadow: 0 10px 30px rgba(0,0,0,.18);
    }

    .lightbox__close{
      position: absolute;
      top: var(--nav-pad-y);
      right: var(--nav-pad-x);
      font-family: var(--font-nav);
      font-size: var(--nav-size);
      line-height: 1;
      background: transparent;
      border: 0;
      padding: 0;
      color: var(--text);
      cursor: pointer;
      transition: color 180ms ease;
    }
    .lightbox__close:hover{ color: var(--red); }


    /* ===== Exhibitions: 年份/日期作为副标题 ===== */
    .ex-list{
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 70ch;
    }
    .ex-item{
      display: grid;
      grid-template-columns: auto 1fr;
      column-gap: 14px;
      align-items: baseline;
    }
    .ex-date{
      font-family: var(--font-ex-date);
      font-size: var(--ex-date-size);
      font-weight: var(--ex-date-weight);
      line-height: 1.2;
      white-space: nowrap;
    }
    .ex-body{
      font-family: var(--font-body);
      font-size: var(--detail-body-size);
      line-height: 1.85;
    }

    /* ====== ✅ Exhibitions panel: text + posters (50/50) ====== */
    .ex-split{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--panel-gap);
      align-items: start;
      min-width: 0;
    }
    .ex-left{ min-width: 0; }
    .ex-posters-wrap{
      position: relative;
      min-width: 0;
      overflow-x: hidden;
      overflow-y: visible;
      /* ✅ Let posters scroll UNDER the fixed header (no visible "roof") */
      margin-top: calc(-1 * var(--header-offset));
      padding-top: var(--header-offset);
    }
    .ex-posters{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--img-gap);
      align-items: start;
      min-width: 0;
      margin-top: 0px;
    }
    .ex-poster-col{
      display: flex;
      flex-direction: column;
      gap: var(--img-gap);
      overflow: auto;          /* ✅ 每列独立滚动 */
      max-height: 320px;       /* ✅ JS 会在打开时改成与文字同高 */
      padding-right: 6px;      /* ✅ 给滚动条一点空间（即使隐藏也更稳） */
      min-width: 0;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .ex-poster-col::-webkit-scrollbar{ width:0; height:0; }

    .ex-fog{
      content: "";
      position: absolute;
      left: 0; right: 0;
      bottom: 0;
      height: clamp(90px, 22%, 160px);
      pointer-events: none;
      /* ✅ white fog fade (no blur): from bottom to top */
      background: linear-gradient(
        to top,
        rgba(255,255,255,1) 0%,
        rgba(255,255,255,.92) 30%,
        rgba(255,255,255,.55) 65%,
        rgba(255,255,255,0) 100%
      );
    }

    /* ===== works list ===== */
    .works{
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-start;
      width: 100%;
      max-width: 1600px;
    }
    .work-row{ width: 100%; }

    .work-item{
      display: inline-block;
      font-size: var(--work-size);
      font-family: var(--font-title);
      font-weight: 700;
      letter-spacing: 0.5px;
      line-height: 1.05;
      color: var(--text);
      text-decoration: none;
      transition: color 220ms ease;
      cursor: pointer;
      user-select: none;
    }
    .work-item:hover{ color: var(--red); }

    /* work panels */
    .panel{
      width: 100%;
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transform: translateY(-6px);
      transition: max-height 520ms ease, opacity 260ms ease, transform 260ms ease;
      will-change: max-height, opacity, transform;
      margin-top: 14px;
    }
    .panel.is-open{
      opacity: 1;
      transform: translateY(0);
    }
    .panel-inner{
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: var(--panel-gap);
      padding: 18px 0 6px 0;
      align-items: start;
    }

    .panel-inner > div{ min-width: 0; }

    .detail-desc{
      font-family: var(--font-body);
      font-size: var(--detail-body-size);
      line-height: 1.85;
      margin: 0 0 18px 0;
      max-width: 44ch;
      white-space: pre-wrap;
    }

    details{ margin: 14px 0; }

    /* ====== ✅ 2) Book/Exhibition hover 变红 ====== */
    summary{
      font-family: var(--font-body);
      font-size: var(--detail-body-size);
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
      padding: 6px 0;
      user-select: none;
      list-style: none;
      color: var(--text);
      transition: color 180ms ease;
    }
    summary:hover{ color: var(--red); }
    summary::-webkit-details-marker{ display:none; }

    .subcontent{
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .subcontent a{
      font-family: var(--font-body);
      font-size: var(--detail-body-size);
      text-decoration: none;
      color: var(--text);
      width: fit-content;
      opacity: .9;
      transition: color 180ms ease, opacity 180ms ease;
      white-space: pre-line;   /* ✅ 关键 */
      display: block;
    }
    .subcontent a:hover{ color: var(--red); opacity: 1; }

    /* ✅ Imprint/静态内容：hover 不变红 */
    .subcontent a.no-red:hover{ color: var(--text); opacity: .9; }


    @media (max-width: 900px){
      main{ padding-left: 18px; padding-right: 18px; }
      .menu-panel-inner,
      .panel-inner{ grid-template-columns: 1fr; }
      .menu-panel-inner.one-col{ grid-template-columns: 1fr; }
      .menu-text, .menu-block{ max-width: 70ch; }
      .ex-item{ grid-template-columns: 1fr; row-gap: 6px; }
      .ex-date{ white-space: normal; }
      .gallery-row.two{ grid-template-columns: 1fr; } /* 小屏两列变一列 */
      .gallery-split{ grid-template-columns: 1fr; }
      .gallery-col{ max-height: none; overflow: visible; padding-right: 0; }
      .ex-split{ grid-template-columns: 1fr; }
      .ex-posters{ grid-template-columns: 1fr; }
      .ex-poster-col{ max-height: none; overflow: visible; padding-right: 0; }

    }
  
  </style>
</head>

<body>
  <div class="bg" id="bgWrap" aria-hidden="true">
    <div class="bg__layer" id="bgA"></div>
    <div class="bg__layer" id="bgB"></div>
  </div>

  <header>
    <div class="brand">
      <a href="#" id="navName" aria-label="Open about">Dakang Wang</a>
    </div>

    <nav class="nav" aria-label="Primary">
      <a href="#" id="navWorks">Works</a>
      <a href="#" id="navExhibitions">Exhibitions</a>
      <a href="#" id="navInfo">Info</a>
    </nav>
  </header>

  <main id="mainScroll">
    <div class="menu-panel" id="panel-name"></div>
    <div class="menu-panel" id="panel-exhibitions"></div>
    <div class="menu-panel" id="panel-info"></div>

    <section class="works" id="worksList" aria-label="Works list">
      <div class="work-row">
        <a class="work-item" href="The Breath of Metal.html"
           data-work-id="metal"
           data-bg="Home page image/mine.jpg">
          The Breath of Metal： Baiyin - What the mine left behind, 2025
        </a>
        <div class="panel" id="panel-metal"></div>
      </div>

      <div class="work-row">
        <a class="work-item" href="work-3.html"
           data-work-id="book-metal"
           data-bg="The Breath of Metal/Diplom Exhibition/_DSC0113.jpg">
          Book: The Breath of Metal, 2025
        </a>
        <div class="panel" id="panel-book-metal"></div>
      </div>

      <div class="work-row">
        <a class="work-item" href="No Feeding/Exhibition_Fruchthalle_01.jpg"
           data-work-id="nofeeding"
           data-bg="No Feeding/Exhibition_Fruchthalle_02.jpg">
          No Feeding, 2025
        </a>
        <div class="panel" id="panel-nofeeding"></div>
      </div>

      <div class="work-row">
        <a class="work-item" href="work-3.html"
           data-work-id="butt"
           data-bg="Home page image/butt.jpg">
          Butt, 2023
        </a>
        <div class="panel" id="panel-butt"></div>
      </div>

      <div class="work-row">
        <a class="work-item" href="work-4.html"
           data-work-id="house"
           data-bg="Home page image/tree.jpg">
          House, 2019
        </a>
        <div class="panel" id="panel-house"></div>
      </div>

      <div class="work-row">
        <a class="work-item" href="work-5.html"
           data-work-id="home"
           data-bg="Home page image/home.jpg">
          Home, sweet home, 2019
        </a>
        <div class="panel" id="panel-home"></div>
      </div>

      <div class="work-row">
        <a class="work-item" href="work-6.html"
           data-work-id="exp1"
           data-bg="Home page image/exp2.jpg">
          Expirement No.2, 2019
        </a>
        <div class="panel" id="panel-exp1"></div>
      </div>

      <div class="work-row">
        <a class="work-item" href="work-7.html"
           data-work-id="exp2"
           data-bg="Home page image/exp1.jpg">
          Expirement No.1, 2018
        </a>
        <div class="panel" id="panel-exp2"></div>
      </div>
    </section>
  </main>

  <script>
    const bgWrap = document.getElementById("bgWrap");
    const bgA = document.getElementById("bgA");
    const bgB = document.getElementById("bgB");

    const workLinks = Array.from(document.querySelectorAll(".work-item"));
    const worksList = document.getElementById("worksList");
    const mainScroll = document.getElementById("mainScroll");

    let showingA = true;
    let currentUrl = "";

    let openWorkId = null;
    let openMenu = null; // "name" | "info" | "exhibitions" | null

    /* ===== ✅ Lightbox（点击图片放大） ===== */
    let lightboxEl = null;
    let lightboxImgEl = null;

    function ensureLightbox(){
      if (lightboxEl) return;

      lightboxEl = document.createElement("div");
      lightboxEl.className = "lightbox";
      lightboxEl.id = "lightbox";

      lightboxEl.innerHTML = `
        <button class="lightbox__close" type="button" aria-label="Close">Close</button>
        <img class="lightbox__img" alt="">
      `;

      document.body.appendChild(lightboxEl);

      lightboxImgEl = lightboxEl.querySelector(".lightbox__img");
      const closeBtn = lightboxEl.querySelector(".lightbox__close");

      closeBtn.addEventListener("click", closeLightbox);

      // 点击背景关闭（点到图片不关）
      lightboxEl.addEventListener("click", (e)=>{
        if (e.target === lightboxEl) closeLightbox();
      });

      // ESC 关闭
      document.addEventListener("keydown", (e)=>{
        if (e.key === "Escape") closeLightbox();
      });
    }

    function openLightbox(src){
      if (!src) return;
      ensureLightbox();
      lightboxImgEl.src = src;
      lightboxEl.classList.add("is-open");
    }

    function closeLightbox(){
      if (!lightboxEl) return;
      lightboxEl.classList.remove("is-open");
      if (lightboxImgEl) lightboxImgEl.src = "";
    }

    function bindLightboxImages(panel){
      const imgs = Array.from(panel.querySelectorAll('img[data-lightbox="1"]'));
      imgs.forEach(img=>{
        img.addEventListener("click", (e)=>{
          e.preventDefault();
          e.stopPropagation();
          openLightbox(img.getAttribute("data-fullsrc") || img.src);
        });
      });
    }


    function anyOpen(){ return !!openWorkId || !!openMenu; }

    function setBg(url){
      if (anyOpen()) return;
      if (!url || url === currentUrl) return;
      currentUrl = url;

      const next = showingA ? bgB : bgA;
      const prev = showingA ? bgA : bgB;

      next.style.backgroundImage = `url("${url}")`;
      next.classList.add("is-visible");
      prev.classList.remove("is-visible");

      showingA = !showingA;
    }

    function clearBg(){
      bgA.classList.remove("is-visible");
      bgB.classList.remove("is-visible");
      currentUrl = "";
    }

    function hideBackgroundForReading(){
      clearBg();
      bgWrap.classList.add("is-hidden");
    }

    function updateBackgroundMode(){
      if (!anyOpen()){
        bgWrap.classList.remove("is-hidden");
      } else {
        bgWrap.classList.add("is-hidden");
      }
    }

    workLinks.forEach((el) => {
      el.addEventListener("mouseenter", () => setBg(el.getAttribute("data-bg")));
    });

    worksList.addEventListener("mouseleave", () => {
      if (!anyOpen()) clearBg();
    });

    /* ===== Works data =====
       ✅ 3) images 支持两种写法：
       - 单张一行： "a.jpg"
       - 两张并列： ["a.jpg","b.jpg"]
    */
    const worksData = {
      metal: {
        desc: `My artistic practice explores the relationships between metal, mining, and the intertwined histories of family and city. Metal functions in my work both as material and as language, carrying weight, sound, and time, while preserving traces of political and labor processes embedded within it.

I grew up in Baiyin, Gansu Province, China, known as the “Copper City,” an industrial town shaped by mining. Several generations of my family worked in the mines, in smelting, and in ore processing. These personal histories do not appear in my work as nostalgia, but as a structural framework that shapes my understanding of materiality, body, and urban space. In my work, the mine is not merely a geographic site, but an evolving system: from ore to metal, from metal to infrastructure, from infrastructure to city, and eventually to ruin.

Methodologically, I begin with photography, archives, and the material itself. I work on site in mining regions, photograph and collect ores, discarded metals, tools, and industrial remnants, alongside family photographs and historical documents. These materials are recontextualized in the studio under controlled light, where they detach from their original function and become a form of “suspended evidence.”

My practice spans photography, video, sound, and installation. Photography operates as a process of extraction and transformation rather than mere documentation. Video and sound introduce time, breath, vibration, and industrial rhythms. Through layering these media, I investigate how resources shape cities, environments, bodies, and how mining histories persist, even as they gradually disappear into the ground and the archive.`,

        book: [
          { label: "Book PDF / Preview", href: "The Breath of Metal.html" },
          { label: "Chapter / Text", href: "The Breath of Metal.html" }
        ],
        exhibition: [
          { label: "Diplom Exhibition", href: "The Breath of Metal.html" }
        ],


         /* ✅ Imprint, Books, Exhibitions展开选项在这里编辑 */

        desc: `Pigeons are among the most ordinary animals in urban life. In cities across Germany, they appear daily in alleyways, on rooftops, in public squares, and along railings. During my research, I even encountered numerous pigeon-related photographs and documents in the Karlsruhe city archive.

    function renderGallery(images){
      return (images || []).map(item => {
        if (Array.isArray(item)){
          const a = item[0] || "";
          const b = item[1] || "";
          return `
            <div class="gallery-row two">
              ${a ? `<img src="${a}" alt="">` : ""}
              ${b ? `<img src="${b}" alt="">` : ""}
            </div>
          `;
        }
        return `
          <div class="gallery-row one">
            <img src="${item}" alt="">
          </div>
        `;
      }).join("");
    }

    function getWorkSections(work){
      // ✅ per-work editable sections:
      // work.sections = [{ title: "Book/Imprint/...", links: [{label, href}, ...] }, ...]
      // Backward compatible: if sections is missing, it will use work.book + work.exhibition.
      if (Array.isArray(work.sections) && work.sections.length) return work.sections;

      const sections = [];
      if (Array.isArray(work.book) && work.book.length){
        sections.push({ title: "Book", links: work.book });
      }
      if (Array.isArray(work.exhibition) && work.exhibition.length){
        sections.push({ title: "Exhibition", links: work.exhibition });
      }
      return sections;
    }

    /* ====== ✅ Works images: 双列拆分 + 渲染（每列独立滚动） ====== */
    function splitImagesForColumns(images){
      const left = [];
      const right = [];
      let toggle = 0;

      (images || []).forEach(item=>{
        if (Array.isArray(item)){
          const a = item[0];
          const b = item[1];
          if (a) left.push(a);
          if (b) right.push(b);
          return;
        }
        if (!item) return;
        if (toggle % 2 === 0) left.push(item);
        else right.push(item);
        toggle += 1;
      });

      return { left, right };
    }

    function renderGalleryColumn(list){
      return (list || []).map(src => `
        <img class="zoomable" src="${src}" data-lightbox="1" data-fullsrc="${src}" alt="">
      `).join("");
    }

    function renderGallerySplit(images){
      const cols = splitImagesForColumns(images);
      return `
        <div class="gallery-split">
          <div class="gallery-col">${renderGalleryColumn(cols.left)}</div>
          <div class="gallery-col">${renderGalleryColumn(cols.right)}</div>
        </div>
      `;
    }

    /* ====== ✅ Exhibitions posters: 双列独立滚动（菜单区） ====== */
    function renderExPosterSplit(images){
      const cols = splitImagesForColumns(images);
      return `
        <div class="ex-posters-wrap">
          <div class="ex-posters">
            <div class="ex-poster-col">${renderGalleryColumn(cols.left)}</div>
            <div class="ex-poster-col">${renderGalleryColumn(cols.right)}</div>
          </div>
          <div class="ex-fog" aria-hidden="true"></div>
        </div>
      `;
    }

    function buildWorkPanelHTML(work){
      const sections = getWorkSections(work);

      const sectionsHTML = (sections || []).map(section => {
        const linksHTML = (section.links || [])
          .map(x => {
            const title = (section.title || "").toLowerCase();
            const noRed = section.noHover === true || section.type === "static" || title.includes("imprint");
            const cls = noRed ? "no-red" : "";
            return `<a class="${cls}" href="${x.href}">${x.label}</a>`;
          })
          .join("");

        return `
          <details>
            <summary>${section.title || ""}</summary>
            <div class="subcontent">${linksHTML}</div>
          </details>
        `;
      }).join("");

      return `
        <div class="panel-inner">
          <div>
            <p class="detail-desc">${work.desc || ""}</p>
            ${sectionsHTML}
          </div>

          <div>
            ${renderGallerySplit(work.images)}
          </div>
        </div>
      `;
    }

    /* ===== ✅ 1) 修复展开 bug：自动高度（图片/折叠变化都会更新） ===== */

    function openWithAutoHeight(panel){
      panel.classList.add("is-open");
      panel.style.maxHeight = "0px";

      requestAnimationFrame(() => {
        panel.style.maxHeight = panel.scrollHeight + "px";
      });

      // 动画结束后解除 max-height 限制（后续增长不裁切）
      const onEnd = (e)=>{
        if (e.propertyName !== "max-height") return;
        panel.removeEventListener("transitionend", onEnd);
        panel.style.maxHeight = "none";
      };
      panel.addEventListener("transitionend", onEnd);
    }

    function bumpHeight(panel){
      // 如果已经解除限制，就不需要 bump
      if (panel.style.maxHeight === "none") return;
      panel.style.maxHeight = panel.scrollHeight + "px";
    }

    function bindDetailsHeightUpdates(panel){
      const detailsEls = Array.from(panel.querySelectorAll("details"));
      detailsEls.forEach(d=>{
        d.addEventListener("toggle", ()=>{
          // toggle 后下一帧再读高度更稳
          requestAnimationFrame(()=> bumpHeight(panel));
          requestAnimationFrame(()=> requestAnimationFrame(()=> bumpHeight(panel)));
        });
      });
    }

    function waitImages(panel){
      const imgs = Array.from(panel.querySelectorAll("img"));
      if (!imgs.length) return Promise.resolve();

      return Promise.all(imgs.map(img=>{
        if (img.complete && img.naturalWidth) return Promise.resolve();
        return new Promise(res=>{
          img.addEventListener("load", res, { once:true });
          img.addEventListener("error", res, { once:true });
        });
      }));
    }

    async function openWorkPanel(id){
      const panel = document.getElementById(`panel-${id}`);
      const data = worksData[id];
      if (!panel || !data) return;

      hideBackgroundForReading();

      panel.innerHTML = buildWorkPanelHTML(data);

      // Book/Exhibition 打开/关闭时也更新高度
      bindDetailsHeightUpdates(panel);

      // 点击图片放大
      bindLightboxImages(panel);

      // 先展开
      openWithAutoHeight(panel);

      // 图片加载过程中：每加载一张 bump 一次（关键：修复“要点两次”）
      const imgs = Array.from(panel.querySelectorAll("img"));
      imgs.forEach(img=>{
        if (img.complete && img.naturalWidth) return;
        img.addEventListener("load", ()=> bumpHeight(panel), { once:true });
        img.addEventListener("error", ()=> bumpHeight(panel), { once:true });
      });

      // 全部加载完再 bump 一次（保险）
      await waitImages(panel);
      bumpHeight(panel);
    }

    function closeWorkPanel(id){
      const panel = document.getElementById(`panel-${id}`);
      if (!panel) return;

      // 如果是 none，先锁定当前高度，才能收起动画
      if (panel.style.maxHeight === "none"){
        panel.style.maxHeight = panel.scrollHeight + "px";
      } else {
        panel.style.maxHeight = panel.scrollHeight + "px";
      }

      requestAnimationFrame(()=>{
        panel.style.maxHeight = "0px";
        panel.classList.remove("is-open");
      });

      panel.addEventListener("transitionend", function handler(e){
        if (e.propertyName === "max-height" && panel.style.maxHeight === "0px"){
          panel.removeEventListener("transitionend", handler);
          if (openWorkId === id) openWorkId = null;
          updateBackgroundMode();
        }
      });
    }

          { date: " ", text: " " },
          { date: "Past Exhibitions", text: " " },
          { date: "2026", text: "No Feeding, Art Karlsruhe, Academy Square, Halle 3, Karlsruhe, Germany" },
          { date: "2026", text: "The Breath of Metal, HfG Diplom Exhibition Week, ZKM Pavilion, Karlsruhe, Germany" },
          { date: "2025", text: "No Feeding, Wasser auf Kiefer - oder- Die Zeit liegt quer, Staedtische Galerie Rastatt, Rastatt, Germany" },
          { date: "2023", text: "Butts, HfG Rundgang, HfG Karlsruhe, Karlsruhe, Germany" },
          { date: "2023", text: "Growing with the Mine, Mining Photography, HfG Karlsruhe, Karlsruhe, Germany" },
          { date: "2022", text: "The Match, Lobby, Staedtische Galerie Karlsruhe, Karlsruhe, Germany" },
          { date: "2021", text: "Sukiyaki, HfG Rundgang, HfG Karlsruhe, Karlsruhe, Germany" },
          { date: "2019", text: "Expierment No.2, Graduation Exhibition, Sichuan Fine Arts Institute Art Museum, Chongqing, China" },
          { date: "2021", text: "Sukiyaki, HfG Rundgang, HfG Karlsruhe, Karlsruhe, Germany" },
          { date: "2018", text: "Expierment No.1, Sichuan Fine Arts Institute Art Museum, Chongqing, China" }
        ]
      }
    };

    function buildMenuPanelHTML(key){
      const data = menuData[key];
      if (!data) return "";

      
      if (key === "exhibitions"){
        const rows = (data.items || []).map(it => `
          <div class="ex-item">
            <div class="ex-date">${it.date || ""}</div>
            <div class="ex-body">${it.text || ""}</div>
          </div>
        `).join("");

        const postersHTML = renderExPosterSplit(data.posters || []);

        return `
          <div class="menu-panel-inner one-col">
            <div class="ex-split">
              <div class="ex-left">
                <h2 class="menu-title">${data.title}</h2>
                <div class="ex-list">${rows}</div>
              </div>

              <div>
                ${postersHTML}
              </div>
            </div>
          </div>
        `;
      }


      if (key === "info"){
        return `
          <div class="menu-panel-inner">
            <div>
              <h2 class="menu-title">${data.title}</h2>

              <div class="menu-subtitle menu-subtitle--first">Contact</div>
              <div class="menu-links">
                <a class="is-underlined" href="${data.contact.instagram}" target="_blank" rel="noreferrer">Instagram</a>
                <a class="is-underlined" href="mailto:${data.contact.email}">${data.contact.email}</a>
                <a href="tel:${data.contact.phone.replace(/\\s|\$begin:math:text$\|\\$end:math:text$|-/g,'')}">${data.contact.phone}</a>
              </div>

              <div class="rights">© All Rights reserved by Dakang Wang.</div>
            </div>
            <div></div>
          </div>
        `;
      }

      const eduBlocks = (data.education || []).map(e => `
        <div class="menu-block">
          <div class="menu-time">${e.time || ""}</div>
          <p>${e.text || ""}</p>
        </div>
      `).join("");

      const imgs = (data.images || []).map(src => `<div class="gallery-row one"><img src="${src}" alt=""></div>`).join("");

      return `
        <div class="menu-panel-inner">
          <div>
            <div class="menu-subtitle menu-subtitle--first">Education</div>
            ${eduBlocks}

            <div class="menu-subtitle">Artist Statement</div>
            <p class="menu-text">${data.artistStatement || ""}</p>
          </div>

          <div>
            <div class="gallery">${imgs}</div>
          </div>
        </div>
      `;
    }

    
    /* ====== ✅ Exhibitions: posters height sync (match left text height) ====== */
    function syncExPosterHeight(panelEl){
      if (!panelEl) return;

      const left = panelEl.querySelector(".ex-left");
      const list = panelEl.querySelector(".ex-left .ex-list");
      const wrap = panelEl.querySelector(".ex-posters-wrap");
      const cols = Array.from(panelEl.querySelectorAll(".ex-poster-col"));

      if (!left || !list || !wrap || !cols.length) return;

      const listRect = list.getBoundingClientRect();
      const wrapRect = wrap.getBoundingClientRect();

      // ✅ Visible bottom should match the last line of the exhibition text
      //     (wrap is pulled up behind the fixed header via CSS margin-top)
      const h = Math.max(0, Math.round(listRect.bottom - wrapRect.top));
      cols.forEach(col=>{
        col.style.maxHeight = h ? (h + "px") : "";
      });
    }

    function bindExPosterResize(panelEl){
      if (!panelEl) return;

      // Clean old observer if any
      if (panelEl._exRO){
        try{ panelEl._exRO.disconnect(); }catch(e){}
        panelEl._exRO = null;
      }
      if (typeof ResizeObserver === "undefined") return;

      const left = panelEl.querySelector(".ex-left");
      const list = panelEl.querySelector(".ex-left .ex-list");
      if (!left || !list) return;

      const ro = new ResizeObserver(()=> syncExPosterHeight(panelEl));
      ro.observe(left);
      ro.observe(list);
      panelEl._exRO = ro;
    }
function getMenuPanelEl(key){
      if (!key) return null;
      return document.getElementById(`panel-${key}`);
    }

    function openMenuPanel(key){
      const el = getMenuPanelEl(key);
      if (!el) return;

      hideBackgroundForReading();

      el.innerHTML = buildMenuPanelHTML(key);

      // ✅ Exhibitions: posters + lightbox
      if (key === "exhibitions"){
        // posters columns height = left text height
        syncExPosterHeight(el);
        bindExPosterResize(el);
        // clickable posters
        bindLightboxImages(el);
      }

      // ✅ 菜单面板也用自动高度（修复第一次打开图片不完整）
      openWithAutoHeight(el);

      // 图片加载过程中：每加载一张 bump 一次
      const imgs = Array.from(el.querySelectorAll("img"));
      imgs.forEach(img=>{
        if (img.complete && img.naturalWidth) return;
        img.addEventListener("load", ()=> { if (key === "exhibitions") syncExPosterHeight(el); bumpHeight(el); }, { once:true });
        img.addEventListener("error", ()=> { if (key === "exhibitions") syncExPosterHeight(el); bumpHeight(el); }, { once:true });
      });

      // 全部加载完再 bump 一次（保险）
      waitImages(el).then(()=> { if (key === "exhibitions") syncExPosterHeight(el); bumpHeight(el); });
    }

    function closeMenuPanel(key){
      const el = getMenuPanelEl(key);
      if (!el) return;

      // ✅ cleanup exhibitions ResizeObserver
      if (key === "exhibitions" && el._exRO){
        try{ el._exRO.disconnect(); }catch(e){}
        el._exRO = null;
      }

      // 如果是 none，先锁定当前高度，才能收起动画
      if (el.style.maxHeight === "none"){
        el.style.maxHeight = el.scrollHeight + "px";
      } else {
        el.style.maxHeight = el.scrollHeight + "px";
      }

      requestAnimationFrame(()=>{
        el.style.maxHeight = "0px";
        el.classList.remove("is-open");
      });

      el.addEventListener("transitionend", function handler(e){
        if (e.propertyName === "max-height" && el.style.maxHeight === "0px"){
          el.removeEventListener("transitionend", handler);
          updateBackgroundMode();
        }
      });
    }

    /* 只能同时展开一项：打开新的前，先关掉当前菜单 + 当前作品 */
    function closeAll(explicitAlsoCloseWorks = true){
      if (openMenu){
        const k = openMenu;
        openMenu = null;
        closeMenuPanel(k);
      }
      if (explicitAlsoCloseWorks && openWorkId){
        const w = openWorkId;
        openWorkId = null;
        closeWorkPanel(w);
      }
    }

    function toggleMenu(key){
      document.body.classList.remove("works-tight");

      if (openMenu === key){
        const k = openMenu;
        openMenu = null;
        closeMenuPanel(k);
        return;
      }

      closeAll(true);

      openMenu = key;
      openMenuPanel(key);

      mainScroll.scrollTo({ top: 0, behavior: "smooth" });
    }

    /* ===== header actions ===== */
    const navName = document.getElementById("navName");
    const navWorks = document.getElementById("navWorks");
    const navInfo = document.getElementById("navInfo");
    const navExhibitions = document.getElementById("navExhibitions");

    navName.addEventListener("click", (e)=>{ e.preventDefault(); toggleMenu("name"); });
    navInfo.addEventListener("click", (e)=>{ e.preventDefault(); toggleMenu("info"); });
    navExhibitions.addEventListener("click", (e)=>{ e.preventDefault(); toggleMenu("exhibitions"); });

    navWorks.addEventListener("click", (e)=>{
      e.preventDefault();

      closeAll(true);

      bgWrap.classList.remove("is-hidden");
      clearBg();

      mainScroll.scrollTo({ top: 0, behavior: "smooth" });

      document.body.classList.remove("works-tight");
      void document.body.offsetWidth;
      document.body.classList.add("works-tight");
    });

    /* ===== work click: expand/collapse ===== */
    workLinks.forEach(el=>{
      el.addEventListener("click", async (e)=>{
        const id = el.getAttribute("data-work-id");
        if (!id) return;

        if (e.metaKey || e.ctrlKey || e.button === 1) return;
        e.preventDefault();

        if (openMenu){
          const k = openMenu;
          openMenu = null;
          closeMenuPanel(k);
        }

        if (openWorkId === id){
          const w = openWorkId;
          openWorkId = null;
          closeWorkPanel(w);
          return;
        }

        if (openWorkId){
          const w = openWorkId;
          openWorkId = null;
          closeWorkPanel(w);
        }

        openWorkId = id;
        await openWorkPanel(id);

        el.scrollIntoView({ behavior:"smooth", block:"start" });
      });
    });
  </script>
